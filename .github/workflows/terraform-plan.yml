# Optional: Terraform plan on PR (no apply; use terraform-apply.yml for apply with OIDC or token)
# Requires: GitHub Secrets CONFLUENT_CLOUD_API_KEY, CONFLUENT_CLOUD_API_SECRET; Azure secrets; GitHub Environment "terraform" with OWNER_EMAIL (and optionally ENVIRONMENT)
name: Terraform Plan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false
        env:
          CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
          CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -input=false -no-color -out=tfplan || true
        env:
          CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
          CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}
          TF_VAR_environment: ${{ vars.ENVIRONMENT }}
          TF_VAR_confluent_cloud_api_key: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
          TF_VAR_confluent_cloud_api_secret: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
